name: Build Qu33ph DS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build qu33ph.nds
        run: |
          echo "BLOCKSDS is set to: '$BLOCKSDS'"
          RULES="$BLOCKSDS/sys/default_makefiles/rom_arm9/Makefile"
          if [ ! -f "$RULES" ]; then
            RULES=$(find "$BLOCKSDS" /opt/wonderful -path '*rom_arm9*' -name Makefile 2>/dev/null | head -n1)
          fi
          if [ -z "$RULES" ] || [ ! -f "$RULES" ]; then
            echo "No ROM build rules found. Contents of the SDK:"
            ls -la "$BLOCKSDS" || true
            exit 1
          fi
          echo "Using build rules: $RULES"
          rm -f source/assets_mini.c
          mkdir -p nitrofs
          find . -name '*.pak' -not -path './nitrofs/*' -exec cp {} nitrofs/ \;
          echo "Game packs going into the cartridge:"; ls -la nitrofs
          if [ ! -f nitrofs/mini.pak ] || [ ! -f nitrofs/ball.pak ]; then
            echo "mini.pak and ball.pak are missing: upload them into the source folder"; exit 1
          fi
          printf '%s\n' \
            'NAME          := qu33ph' \
            'GAME_TITLE    := Qu33ph DS' \
            'GAME_SUBTITLE := Flick markers' \
            'GAME_AUTHOR   := Qu33ph' \
            'SOURCEDIRS    := source' \
            'NITROFSDIR    := nitrofs' \
            "include $RULES" > Makefile
          cat Makefile
          make NITROFSDIR=nitrofs
          ls -la *.nds
          if ! grep -q QPAK qu33ph.nds; then
            echo "packs not in the .nds yet: adding them with ndstool"
            NDSTOOL=$(command -v ndstool || find "$BLOCKSDS" /opt -name ndstool -type f 2>/dev/null | head -n1)
            echo "ndstool: $NDSTOOL"
            mkdir -p romparts && cd romparts
            "$NDSTOOL" -x ../qu33ph.nds -9 arm9.bin -7 arm7.bin -t banner.bin -h header.bin
            "$NDSTOOL" -c ../qu33ph.nds -9 arm9.bin -7 arm7.bin -t banner.bin -h header.bin -d ../nitrofs
            cd ..
          fi
          if grep -q QPAK qu33ph.nds; then echo "OK: game packs are inside qu33ph.nds"; else echo "FAILED: packs missing from qu33ph.nds"; exit 1; fi
          ls -la *.nds

      - uses: actions/upload-artifact@v4
        with:
          name: qu33ph-nds
          path: "*.nds"
