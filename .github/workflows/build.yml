name: Build Qu33ph DS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build qu33ph.nds
        run: |
          echo "BLOCKSDS is set to: '$BLOCKSDS'"
          T=""
          for base in "$BLOCKSDS" /opt/wonderful/thirdparty/blocksds/core /opt/blocksds/core /opt/wonderful /opt /usr/local; do
            [ -n "$base" ] && [ -d "$base" ] || continue
            T=$(find "$base" -path '*templates*rom_arm9*' -name Makefile 2>/dev/null | head -n1)
            [ -n "$T" ] && break
          done
          if [ -z "$T" ]; then
            echo "Could not find the BlocksDS template. What is installed:"
            ls -la /opt || true
            find / -maxdepth 6 -type d -name templates 2>/dev/null | head -n 20
            exit 1
          fi
          CORE="${T%%/templates/*}"
          echo "Using template: $T"
          echo "BlocksDS core:  $CORE"
          cp "$T" Makefile
          make BLOCKSDS="$CORE" NAME=qu33ph GAME_TITLE="Qu33ph DS" GAME_SUBTITLE="Flick markers" GAME_AUTHOR="Qu33ph"
          ls -la *.nds

      - uses: actions/upload-artifact@v4
        with:
          name: qu33ph-nds
          path: "*.nds"
